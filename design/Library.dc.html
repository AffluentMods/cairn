<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{--bg:#0E1412;--surface:#15201B;--raised:#1E2C25;--larch:#D9A441;--glacier:#3FB8AF;
      --text:#F1EEE6;--dim:#A9B0AB;--line:#243029;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
    a{color:var(--glacier);}
    .tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:var(--dim);}
    .tab.on{color:var(--text);border-bottom:2px solid var(--larch);}
    .item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);}
    .ic{width:34px;height:34px;border-radius:17px;background:var(--raised);display:flex;align-items:center;justify-content:center;flex:none;}
  </style>
</helmet>
<div style="height:844px;width:390px;position:relative;overflow:hidden;background:var(--bg);">
  <!-- APP BAR -->
  <div style="height:96px;padding:52px 18px 0;display:flex;align-items:center;background:var(--surface);">
    <div style="font-size:20px;font-weight:600;flex:1;">Library</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1EEE6" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9B0AB" stroke-width="2" style="margin-left:16px"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
  </div>
  <!-- TABS -->
  <div style="display:flex;background:var(--surface);border-bottom:1px solid var(--line);">
    <div class="tab on">Routes</div><div class="tab">Tracks</div><div class="tab">Offline</div>
  </div>

  <!-- LIST -->
  <div class="item">
    <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="2"><path d="M4 18 L10 6 L14 16 L20 5"/></svg></div>
    <div style="flex:1;">
      <div style="font-size:15px;">Goat Rocks loop</div>
      <div class="mono" style="font-size:12px;color:var(--dim);margin-top:2px;">Sep 10  18.4 mi  +3,609 ft</div>
    </div>
    <svg width="60" height="24" viewBox="0 0 60 24"><polyline points="0,20 12,15 24,8 34,4 44,12 60,18" fill="none" stroke="#3FB8AF" stroke-width="1.6"/></svg>
  </div>
  <div class="item">
    <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="2"><path d="M4 18 L10 6 L14 16 L20 5"/></svg></div>
    <div style="flex:1;">
      <div style="font-size:15px;">Snowgrass Flats out-and-back</div>
      <div class="mono" style="font-size:12px;color:var(--dim);margin-top:2px;">Aug 28  9.2 mi  +1,900 ft</div>
    </div>
    <svg width="60" height="24" viewBox="0 0 60 24"><polyline points="0,18 15,10 30,6 45,10 60,18" fill="none" stroke="#3FB8AF" stroke-width="1.6"/></svg>
  </div>
  <div class="item">
    <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="2"><path d="M4 18 L10 6 L14 16 L20 5"/></svg></div>
    <div style="flex:1;">
      <div style="font-size:15px;">Mt Adams high camp</div>
      <div class="mono" style="font-size:12px;color:var(--dim);margin-top:2px;">Aug 14  12.1 mi  +4,100 ft</div>
    </div>
    <svg width="60" height="24" viewBox="0 0 60 24"><polyline points="0,20 18,14 36,4 60,2" fill="none" stroke="#3FB8AF" stroke-width="1.6"/></svg>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:66px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;">
    <div style="flex:1;text-align:center;color:var(--dim);font-size:11px;">Map</div>
    <div style="flex:1;text-align:center;color:var(--dim);font-size:11px;">Plan</div>
    <div style="flex:1;text-align:center;color:var(--dim);font-size:11px;">Record</div>
    <div style="flex:1;text-align:center;color:var(--larch);font-size:11px;">Library</div>
  </div>
</div>
</x-dc>
</body>
</html>
