<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{--bg:#0E1412;--surface:#15201B;--raised:#1E2C25;--larch:#D9A441;--glacier:#3FB8AF;
      --fire:#E5484D;--smoke:#F5A524;--text:#F1EEE6;--dim:#A9B0AB;--line:#243029;--water:#4A90E2;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
    a{color:var(--glacier);}
    .stat .n{font-size:15px;} .stat .l{font-size:11px;color:var(--dim);margin-top:2px;}
    .wp{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;}
    .num{width:24px;height:24px;border-radius:12px;background:var(--raised);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;}
  </style>
</helmet>
<div style="height:844px;width:390px;position:relative;overflow:hidden;background:var(--bg);">
  <!-- APP BAR -->
  <div style="height:96px;padding:52px 14px 0;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1EEE6" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <div style="font-size:16px;font-weight:600;flex:1;">Goat Rocks loop</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9B0AB" stroke-width="2"><path d="M4 8a8 8 0 1 1-1 4"/><path d="M4 4v4h4"/></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1EEE6" stroke-width="2" style="margin-left:6px"><path d="M6 4h12l-2 4H8z"/><path d="M8 4v13a2 2 0 0 0 8 0"/></svg>
    <div style="color:var(--larch);font-weight:600;font-size:14px;margin-left:10px;">Save</div>
  </div>

  <!-- MAP -->
  <svg viewBox="0 0 390 210" width="390" height="210" style="display:block;">
    <rect width="390" height="210" fill="#111a16"/>
    <g fill="none" stroke="#2a3a30" stroke-width="1"><path d="M0,60 C120,30 240,80 390,50"/><path d="M0,110 C120,80 240,130 390,100"/><path d="M0,165 C120,135 240,180 390,150"/></g>
    <path d="M60,170 C120,140 130,90 210,80 280,72 260,40 330,45" fill="none" stroke="#0E1412" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M60,170 C120,140 130,90 210,80 280,72 260,40 330,45" fill="none" stroke="#D9A441" stroke-width="3.5" stroke-linecap="round"/>
    <g font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#0E1412">
      <circle cx="60" cy="170" r="9" fill="#D9A441"/><text x="60" y="173.5" text-anchor="middle">1</text>
      <circle cx="210" cy="80" r="9" fill="#D9A441"/><text x="210" y="83.5" text-anchor="middle">2</text>
      <circle cx="330" cy="45" r="9" fill="#D9A441"/><text x="330" y="48.5" text-anchor="middle">3</text>
    </g>
  </svg>

  <!-- STATS + PROFILE + LIST -->
  <div style="padding:14px 18px;">
    <div style="display:flex;">
      <div class="stat" style="flex:1"><div class="mono n">18.4 mi</div><div class="l">distance</div></div>
      <div class="stat" style="flex:1"><div class="mono n" style="color:var(--larch)">+3,609</div><div class="l">gain</div></div>
      <div class="stat" style="flex:1"><div class="mono n">-3,590</div><div class="l">loss</div></div>
      <div class="stat" style="flex:1"><div class="mono n">7,880</div><div class="l">high pt</div></div>
    </div>
    <div style="display:flex;align-items:center;margin-top:8px;">
      <div class="mono" style="font-size:13px;color:var(--dim);">est. 8h 10m</div>
      <div class="mono" style="margin-left:auto;font-size:13px;color:var(--dim);">pack 45 lb</div>
    </div>

    <!-- ELEVATION PROFILE -->
    <div style="margin-top:12px;background:#0f1713;border:1px solid var(--line);border-radius:10px;padding:6px;">
      <svg viewBox="0 0 322 130" width="100%" height="130" preserveAspectRatio="none">
        <!-- area segments colored by grade -->
        <defs></defs>
        <path d="M0,110 L60,95 L60,130 L0,130 Z" fill="#3EC46D" fill-opacity=".18"/>
        <path d="M60,95 L120,60 L120,130 L60,130 Z" fill="#F5A524" fill-opacity=".18"/>
        <path d="M120,60 L175,28 L175,130 L120,130 Z" fill="#E5484D" fill-opacity=".18"/>
        <path d="M175,28 L230,55 L230,130 L175,130 Z" fill="#3EC46D" fill-opacity=".18"/>
        <path d="M230,55 L285,40 L285,130 L230,130 Z" fill="#F5A524" fill-opacity=".18"/>
        <path d="M285,40 L322,105 L322,130 L285,130 Z" fill="#3EC46D" fill-opacity=".18"/>
        <polyline points="0,110 60,95 120,60 175,28 230,55 285,40 322,105" fill="none" stroke-width="2"
          stroke="#8ea36f"/>
        <line x1="175" y1="0" x2="175" y2="130" stroke="#D9A441" stroke-width="1.4"/>
        <!-- water tick -->
        <rect x="112" y="118" width="4" height="12" fill="#4A90E2"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--dim);" class="mono"><span>4,540 ft</span><span>7,880 ft</span></div>
    </div>

    <!-- WAYPOINTS -->
    <div style="margin-top:10px;">
      <div class="wp" style="border-top:none;"><span class="num mono">1</span><span style="flex:1">Berry Patch TH</span><span class="mono" style="color:var(--dim)">0.0 mi</span><span class="mono">4,540</span></div>
      <div class="wp"><span class="num mono">2</span><span style="flex:1">Snowgrass Flats</span><span class="mono" style="color:var(--dim)">4.6 mi</span><span class="mono">5,900</span></div>
      <div class="wp"><span class="num mono">3</span><span style="flex:1">Old Snowy</span><span class="mono" style="color:var(--dim)">7.7 mi</span><span class="mono">7,880</span></div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--dim);">
      <span style="color:var(--water)">▮</span> Water: 0.0 Goat Creek, 4.6 Snowgrass Creek (last before the climb)
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
