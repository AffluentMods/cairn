# Weekly dependency update proposals (security audit finding 10): pub packages
# and the SHA-pinned GitHub Actions in .github/workflows.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
