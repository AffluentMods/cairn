name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.38.9"

# Actions are pinned to commit SHAs (security audit finding 10): a moved tag
# would otherwise run unreviewed code with the repository checkout. Dependabot
# (.github/dependabot.yml) proposes the bumps; the comment carries the tag.
jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: SPDX header check
        run: bash tool/check_spdx.sh

      - name: Theme token check
        run: bash tool/check_theme_tokens.sh

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "Generated code is out of date. Run: dart run build_runner build --delete-conflicting-outputs"
            git diff --stat
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OSV against the resolved pub lockfile (security audit finding 10).
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  build-community-apk:
    name: Build community APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: analyze-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build community APK
        run: flutter build apk --release --flavor community --obfuscate --split-debug-info=build/symbols

      # F-Droid gate (spec Section 12.3): no Play services, Firebase, billing, or
      # RevenueCat classes in the community binary, and no key-shaped strings.
      - name: Verify the community APK carries no Google libraries or keys
        run: python3 tool/check_apk_clean.py build/app/outputs/flutter-apk/app-community-release.apk

      - name: Compute SHA-256
        id: sha
        run: |
          APK=build/app/outputs/flutter-apk/app-community-release.apk
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-community-release.apk
            build/app/outputs/flutter-apk/app-community-release.apk.sha256
