# SPDX-License-Identifier: GPL-3.0-or-later
name: cairn
description: Offline trail maps with fire, smoke, and closure overlays.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State + routing
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  go_router: ^14.0.0

  # Map engine (native MapLibre, BSD-3, offline regions, PMTiles, hillshade)
  maplibre_gl: ^0.22.0

  # Storage
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Network
  dio: ^5.7.0

  # Geo
  latlong2: ^0.9.1
  turf: ^0.0.10
  gpx: ^2.3.0

  # Location + recording
  geolocator: ^13.0.0
  flutter_foreground_task: ^8.17.0
  permission_handler: ^11.3.0

  # Crypto (multi-device sync: Argon2id + AES-GCM key wrapping)
  cryptography: ^2.7.0

  # Misc
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  share_plus: ^12.0.2
  file_picker: ^8.1.0
  url_launcher: ^6.3.0
  collection: ^1.19.0
  uuid: ^4.5.0
  xml: ^6.6.1
  webview_flutter: ^4.14.1
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  drift_dev: ^2.22.0
  freezed: ^2.5.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map_styles/
    - assets/map_previews/
    - assets/data/
    - assets/web/
